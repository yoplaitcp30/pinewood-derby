name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone application
        run: >-
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build
          packaging/windows/PinewoodDerby.spec

      - name: Verify packaged application starts
        shell: pwsh
        run: |
          $platformPlugin = Get-ChildItem "dist\Pinewood Derby Race Manager" -Recurse -Filter qwindows.dll | Select-Object -First 1
          if (-not $platformPlugin) { throw "PyInstaller did not include the Qt Windows platform plugin." }
          $database = Join-Path $env:RUNNER_TEMP "pinewood-smoke.sqlite3"
          $executable = "dist\Pinewood Derby Race Manager\Pinewood Derby Race Manager.exe"
          $arguments = "--smoke-test --database `"$database`""
          $process = Start-Process -FilePath $executable -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path $database)) { throw "Packaged application did not create its database." }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) { throw "Release tag v$tagVersion does not match pyproject version $version." }
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinewoodDerby-Setup
          path: dist/installer/PinewoodDerby-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/installer/PinewoodDerby-Setup.exe
